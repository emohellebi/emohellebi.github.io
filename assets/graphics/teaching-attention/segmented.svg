<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
 <title id="title">Illustrative lecture segments separated by quizzes, discussion, rest, a game and Q&amp;A</title>
 <desc id="desc">Five separate colored explanation curves, each twenty minutes long, restart at varying higher levels after planned activities. Activities occupy minutes 20–23, 43–47, 67–72, 92–96 and 116–120. The final activity closes the session. A dashed uninterrupted comparison is shown. No attention levels are estimated during activities, and recovery is not guaranteed. All lines are invented illustrations, not study results.</desc>
 <rect width="960" height="480" rx="14" fill="#fbfdfc"/>
 <g font-family="Arial,sans-serif">
 <text x="30" y="32" font-size="13" font-weight="700" letter-spacing="1.8" fill="#256452">ILLUSTRATION · NOT MEASURED DATA</text>
 <text x="30" y="66" font-size="25" font-weight="700" fill="#20382f">Explain. Invite participation. Reconnect.</text>

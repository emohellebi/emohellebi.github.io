<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Measured attention ratings during a 40-minute video lecture</title>
  <desc id="desc">Farley, Risko and Kingstone (2013), Table 1, 21 students. Mean attention ratings for successive five-minute intervals are 6.0, 6.3, 5.9, 5.9, 5.4, 5.2, 5.2 and 4.9 on a 1 to 7 scale. Only adjacent means are connected; no smoothing or uncertainty intervals are shown.</desc>
  <rect width="960" height="500" rx="14" fill="#fbfdfc"/>
  <g font-family="Arial,sans-serif">
    <text x="30" y="32" font-size="13" font-weight="700" letter-spacing="1.8" fill="#256452">MEASURED RESULTS · FARLEY ET AL. (2013)</text>
    <text x="30" y="68" font-size="25" font-weight="700" fill="#20382f">Attention ratings across a 40-minute lecture</text>
    <text x="30" y="96" font-size="15" fill="#546c60">21 students · eight five-minute intervals · published group means</text>
    <g stroke="#dce5e0" stroke-width="1">
      <path d="M115 140H900 M115 181.667H900 M115 223.333H900 M115 265H900 M115 306.667H900 M115 348.333H900 M115 390H900"/>
    </g>
    <g font-size="14" fill="#546c60" text-anchor="end">
      <text x="100" y="145">7</text><text x="100" y="186.667">6</text><text x="100" y="228.333">5</text><text x="100" y="270">4</text><text x="100" y="311.667">3</text><text x="100" y="353.333">2</text><text x="100" y="395">1</text>
    </g>
    <text x="48" y="265" text-anchor="middle" transform="rotate(-90 48 265)" font-size="15" fill="#385345">Mean attention rating (1–7)</text>
    <path d="M150 181.667L250 169.167L350 185.833L450 185.833L550 206.667L650 215L750 215L850 227.5" fill="none" stroke="#216b5b" stroke-width="3"/>
    <g fill="#216b5b" stroke="#fbfdfc" stroke-width="2">
      <circle cx="150" cy="181.667" r="6"/><circle cx="250" cy="169.167" r="6"/><circle cx="350" cy="185.833" r="6"/><circle cx="450" cy="185.833" r="6"/><circle cx="550" cy="206.667" r="6"/><circle cx="650" cy="215" r="6"/><circle cx="750" cy="215" r="6"/><circle cx="850" cy="227.5" r="6"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="700" fill="#20382f">
      <text x="150" y="166">6.0</text><text x="250" y="153">6.3</text><text x="350" y="170">5.9</text><text x="450" y="170">5.9</text><text x="550" y="191">5.4</text><text x="650" y="199">5.2</text><text x="750" y="199">5.2</text><text x="850" y="212">4.9</text>
    </g>
    <g text-anchor="middle" fill="#546c60" font-size="14">
      <text x="150" y="417">0–5</text><text x="250" y="417">5–10</text><text x="350" y="417">10–15</text><text x="450" y="417">15–20</text><text x="550" y="417">20–25</text><text x="650" y="417">25–30</text><text x="750" y="417">30–35</text><text x="850" y="417">35–40</text>
      <text x="500" y="446" font-size="16">Lecture interval (minutes)</text>
    </g>
    <text x="30" y="480" font-size="13" fill="#546c60">Redrawn from Table 1 · doi:10.3389/fpsyg.2013.00619 · Self-reported ratings; uncertainty intervals not shown.</text>
  </g>
</svg>

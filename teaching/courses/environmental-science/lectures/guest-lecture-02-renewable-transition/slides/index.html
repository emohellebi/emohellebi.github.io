<script id="slide-data" type="application/json">[{"title": "Renewable Energy", "body": "CHAPTER 10  /  ENVIRONMENTAL SCIENCE\nRenewable\nEnergy\nWhat will power the light next?\nSCIENCE  →  ISSUES  →  SOLUTIONS\n01 / 48", "image": "student-01.webp?v=7ec8c56c5d"}, {"title": "The Central question", "body": "CHAPTER 10  /  CENTRAL QUESTION\nThe Central question\n02 / 48\nCan we develop renewable energy resources to help sustain a thriving economy without adversely affecting the environment?\nSCIENCE  →  ISSUES  →  SOLUTIONS  →  TAKEAWAYS", "image": "student-02.webp?v=0dce1ab683"}, {"title": "Samsø: an energy system, not a single device", "body": "CHAPTER 10  /  SCIENCE\nSamsø: an energy system, not a single device\n03 / 48\nWind supplies electricity\nBiomass and solar energy supply heat\nGrid connections balance imports and exports\nOffshore-wind photograph from the chapter opening.", "image": "student-03.webp?v=654e0f29ec"}, {"title": "Where renewable energy comes from", "body": "CHAPTER 10  /  SCIENCE\nWhere renewable energy comes from\n04 / 48\nPrimary source\nRenewable pathways\nEnergy we use\nSunlight\nSolar, wind, river flow, waves, biomass\nElectricity, heat, fuels\nEarth’s internal heat\nGeothermal systems\nHeat and electricity\nGravitational interactions\nOcean tides\nMotion and electricity\nMost pathways begin with sunlight. Geothermal energy and tides have different primary sources.", "image": "student-04.webp?v=241f2d0efc"}, {"title": "Three ways to use sunlight", "body": "CHAPTER 10  /  SCIENCE\nThree ways to use sunlight\n05 / 48\nDirect heating and daylight\nConcentrating solar power makes heat\nPhotovoltaic cells produce electricity directly\nFig. 10.5: the Oberlin atrium uses sunlight for heat and daylight.", "image": "student-05.webp?v=bbfc8d2f96"}, {"title": "How a photovoltaic cell produces electricity", "body": "CHAPTER 10  /  SCIENCE\nHow a photovoltaic cell produces electricity\n06 / 48\n1  Light supplies energy\n2  The junction separates charges\n3  The external circuit powers a load\nAdapted from Fig. 10.7: absorbed light creates mobile charges, and the junction separates them to drive an external circuit.", "image": "student-06.webp?v=927cf5c533"}, {"title": "Experiment: does panel angle matter?", "body": "CHAPTER 10  /  SCIENCE\nExperiment: does panel angle matter?\n07 / 48\nRelative direct-beam power (%)\nPredict first\nThe same panel turns away from a fixed beam.\n\nWhich angle captures the least power?\nAt 60°, the panel intercepts half the direct-beam power.\nIdeal direct-beam model, not measured PV performance. Angle is measured from the panel’s perpendicular direction.\nAngle of the bean on the panel\n% of Direct Beam Power", "image": "student-07.webp?v=b8d51d1655", "activity": "resources"}, {"title": "Concentrating solar power uses a heat engine", "body": "CHAPTER 10  /  SCIENCE\nConcentrating solar power uses a heat engine\n08 / 48\n1  Mirrors concentrate sunlight\n2  Heat transfers to a steam cycle\n3  A turbine drives the generator\nAdapted from Fig. 10.6 and §10.8: mirrors supply heat, while a separate steam cycle drives a generator.", "image": "student-08.webp?v=4d00f3259e"}, {"title": "A wind turbine converts motion to electricity", "body": "CHAPTER 10  /  SCIENCE\nA wind turbine converts motion to electricity\n09 / 48\n1  Aerodynamic forces turn the rotor\n2  The shaft transfers mechanical energy\n3  The generator produces electricity\nAdapted from Fig. 10.8: moving air turns a rotor coupled to an electrical generator.", "image": "student-09.webp?v=41cd7cb2f2"}, {"title": "Magnus Effect", "body": "CHAPTER 10  /  SCIENCE\nMagnus Effect\n10 / 48\nSPIN CHANGES THE FLOW. THE FLOW EXERTS A SIDEWAYS FORCE.\nREAL SMOKE-TUNNEL EXPERIMENT\nWatch the smoke\nAir enters from the right.\n\nWhen the cylinder spins,\nthe wake bends upward.\nAir up. Force down.\nThe sideways force is\nthe Magnus effect.\nAnimation: MatSouffNC858s · Wikimedia Commons · CC BY-SA 4.0", "image": "student-10.webp?v=4bbfc0f3a8"}, {"title": "Sea breezes reverse as land heats and cools", "body": "CHAPTER 10  /  SCIENCE\nSea breezes reverse as land heats and cools\n11 / 48\nDAY  •  Near-surface air moves from sea to land.\nNIGHT  •  Near-surface flow can reverse toward the sea.\nAdapted from Fig. 10.9: different heating and cooling rates produce daily changes in coastal air circulation.", "image": "student-11.webp?v=d6d217ae7e"}, {"title": "Hydropower uses a height difference", "body": "CHAPTER 10  /  SCIENCE\nHydropower uses a height difference\n12 / 48\n1  Water enters the penstock\n2  Flow turns the turbine\n3  Water returns to the downstream river\nAdapted from Fig. 10.12: water loses gravitational potential energy as it passes through a turbine.", "image": "student-12.webp?v=ef018211b9"}, {"title": "Experiment: doubling the water drop", "body": "CHAPTER 10  /  SCIENCE\nExperiment: doubling the water drop\n13 / 48\nCalculated electrical power (kW)\nHold flow constant\nWhat happens to power when the height difference doubles?\nTwice the head gives twice the power, if flow and efficiency stay constant.\nCalculated classroom example: flow = 1 m³/s, efficiency = 80%, water density = 1,000 kg/m³.", "image": "student-13.webp?v=56cf830a8a"}, {"title": "Tides and waves have different energy sources", "body": "CHAPTER 10  /  SCIENCE\nTides and waves have different energy sources\n14 / 48\nLow tide\nHigh tide\nTides follow gravitational cycles. Most surface waves gain energy from wind.\nFig. 10.14: low and high tide at Hopewell Rocks, Bay of Fundy.", "image": "student-14.webp?v=1b7f39571e"}, {"title": "Geothermal energy transfers Earth’s heat", "body": "CHAPTER 10  /  SCIENCE\nGeothermal energy transfers Earth’s heat\n15 / 48\n1  Hot water brings heat to the surface\n2  A second fluid vaporizes and drives a turbine\n3  Cooled geothermal water returns underground\nAdapted from Fig. 10.19: a binary-cycle plant transfers geothermal heat to a separate working fluid.", "image": "student-15.webp?v=70a4984cb0"}, {"title": "Biomass stores energy in chemical bonds", "body": "CHAPTER 10  /  SCIENCE\nBiomass stores energy in chemical bonds\n16 / 48\nWood and other biomass can burn directly\nSugars and starches can become ethanol\nOils and fats can become biodiesel\nFig. 10.35, excerpt: harvested corn is one possible biofuel feedstock.", "image": "student-16.webp?v=b5c7b2f489"}, {"title": "Cellulosic ethanol requires an extra breakdown step", "body": "CHAPTER 10  /  SCIENCE\nCellulosic ethanol requires an extra breakdown step\n17 / 48\n1  Cellulose contains linked sugar units\n2  Enzymes make sugars accessible\n3  Microbes ferment the sugars\nAdapted from Fig. 10.23: pretreatment and enzymes release sugars before fermentation and ethanol recovery.", "image": "student-17.webp?v=e5e3683502"}, {"title": "Quick quiz: which examples use a turbine?", "body": "CHAPTER 10  /  SCIENCE\nQuick quiz: which examples use a turbine?\n18 / 48\n01\nPhotovoltaic solar electricity\nNo. A semiconductor converts light directly.\n\n02\nConcentrating solar electricity\nYes. In our example, a steam turbine drives a generator.\n\n03\nHydroelectric power\nYes. Moving water turns the turbine.\nDiscuss each pathway before revealing its answer.", "image": "student-18.webp?v=8922fad594", "activity": "conversion"}, {"title": "Science summary", "body": "CHAPTER 10  /  SCIENCE\nScience summary\n19 / 48\n10.1\nSolar energy can provide heat or generate electricity.\nPhotovoltaics and concentrating solar use different mechanisms.\n\n10.2\nWind and water supply mechanical energy.\nGeothermal systems use Earth’s internal heat.\n\n10.3\nBiomass stores chemical energy.\nFuel production requires processing and energy input.", "image": "student-19.webp?v=5522419edf"}, {"title": "Main environmental and social issues", "body": "CHAPTER 10  /  ISSUES\nMain environmental and social issues\n20 / 48\nHabitat loss, fragmentation, and new transmission corridors\nWater demand and competition with other uses\nBird and bat mortality near turbines and power lines\nChanged river flows, sediments, water quality, and fish migration\nDisplacement of communities and loss of livelihoods\nCompetition for agricultural land, food, and water\nImpacts depend on the technology, location, scale, and operating practices.", "image": "student-20.webp?v=28400e9f76"}, {"title": "A sunny landscape is also a habitat", "body": "CHAPTER 10  /  ISSUES\nA sunny landscape is also a habitat\n21 / 48\nLand clearing removes habitat\nRoads and fences interrupt movement\nConstruction can damage burrows and drainage\nFig. 10.25: roads can fragment desert bighorn sheep habitat.", "image": "student-21.webp?v=b8f0e77a62"}, {"title": "Concentrating solar power can compete for water", "body": "CHAPTER 10  /  ISSUES\nConcentrating solar power can compete for water\n22 / 48\nSteam-cycle cooling can consume water\nStrong solar resources often occur in dry regions\nCooling design changes the water requirement\nFig. 10.6a: a tower-based solar plant. Cooling requirements differ from those of photovoltaic panels.", "image": "student-22.webp?v=d6c725fef5"}, {"title": "Energy return on energy investment", "body": "CHAPTER 10  /  ISSUES\nEnergy return on energy investment\n23 / 48\nUseful energy obtained\n200 units\nEnergy invested\n40 units\n\nEROEI = energy out ÷ energy in\n200 ÷ 40 = 5    |    Net energy = 160 units\nIllustrative calculation, not a measured value for a particular fuel or technology.", "image": "student-23.webp?v=672e746b4a", "activity": "eroei"}, {"title": "Wind development affects birds and bats", "body": "CHAPTER 10  /  ISSUES\nWind development affects birds and bats\n24 / 48\nBird collisions\nBat fatalities\nRisk depends on species, location, migration, and turbine operation.\nFigs. 10.28 and 10.30: a golden eagle and eastern red bats illustrate vulnerable wildlife.", "image": "student-24.webp?v=4691e9a750"}, {"title": "Transmission corridors extend the footprint", "body": "CHAPTER 10  /  ISSUES\nTransmission corridors extend the footprint\n25 / 48\nBirds may collide with power lines\nNew roads and corridors can divide habitats\nSome grassland birds avoid tall structures\nRisk extends beyond the turbine or solar-panel boundary\nA project assessment must include the connections that deliver its electricity.", "image": "student-25.webp?v=e5d299eecd"}, {"title": "A dam changes an entire river system", "body": "CHAPTER 10  /  ISSUES\nA dam changes an entire river system\n26 / 48\nReservoirs trap sediments\nDams interrupt fish migration\nWater temperature and oxygen can change\nFlooded organic matter can produce greenhouse gases\nFig. 10.13: the Three Gorges project illustrates the scale of large hydroelectric development.", "image": "student-26.webp?v=d792681d6f"}, {"title": "Hydropower benefits and costs reach different people", "body": "CHAPTER 10  /  ISSUES\nHydropower benefits and costs reach different people\n27 / 48\nElectricity may serve distant cities\nFlooding can displace households\nFishing, farming, and cultural sites can be lost\nAffected communities need a meaningful voice\nFig. 10.34: a resident in a partly demolished home before inundation by the Three Gorges reservoir.", "image": "student-27.webp?v=d15bb8c1b9"}, {"title": "Biofuel demand can change food and land systems", "body": "CHAPTER 10  /  ISSUES\nBiofuel demand can change food and land systems\n28 / 48\nDiverse prairie\nIntensive crop production\nFood competition, fertilizer runoff, soil loss, and habitat conversion can occur along the fuel pathway.\nFig. 10.36: contrasting ecosystems illustrate the consequences of converting land to intensive agriculture.", "image": "student-28.webp?v=885a4719e8"}, {"title": "Comparing complete renewable-energy pathways", "body": "CHAPTER 10  /  ISSUES\nComparing complete renewable-energy pathways\n29 / 48\nPathway\nMain pressures\nQuestions before development\nSolar\nLand, materials, cooling water for thermal systems\nWhich site and cooling design?\nWind\nWildlife, roads, transmission corridors\nWhich species, seasons, and routes?\nHydropower\nRiver change, flooded land, displacement\nWhat happens upstream and downstream?\nBiofuels\nFood and land competition, runoff, soil loss\nWhich feedstock and production boundary?\nA chapter synthesis. Local conditions determine the importance of each pressure.", "image": "student-29.webp?v=0a13e7a1b7"}, {"title": "Issues summary", "body": "CHAPTER 10  /  ISSUES\nIssues summary\n30 / 48\n10.4\nSolar development can affect habitats and water supplies.\n\n10.5\nWind turbines and transmission lines can harm wildlife.\n\n10.6\nDams alter rivers and can displace communities.\n\n10.7\nBiofuel expansion can compete with food and damage ecosystems.", "image": "student-30.webp?v=81594dfb25"}, {"title": "Solar siting can reduce habitat damage", "body": "CHAPTER 10  /  SOLUTIONS\nSolar siting can reduce habitat damage\n31 / 48\nUse suitable rooftops and developed sites\nCheck structural, shading, and grid constraints\nReduce pressure on intact habitats\nFig. 10.40: rooftop photovoltaic systems in Freiburg, Germany.", "image": "student-31.webp?v=701b8b51f7"}, {"title": "Storage shifts energy in time", "body": "CHAPTER 10  /  SOLUTIONS\nStorage shifts energy in time\n32 / 48\nStorage approach\nWhat is stored?\nWhat must be checked?\nThermal storage\nHeat, for example in molten salt\nHeat loss and usable temperature\nBatteries\nElectrochemical energy\nPower, usable capacity, and losses\nPumped storage\nWater at higher elevation\nReservoirs, water, and terrain\nStored energy can serve later demand, but every storage system has limits and losses.", "image": "student-32.webp?v=dd14c80b0d"}, {"title": "Storage challenge: is the evening covered?", "body": "CHAPTER 10  /  SOLUTIONS\nStorage challenge: is the evening covered?\n33 / 48\nEnergy (MWh)\nEfficiency = 80%\n2.0 MWh goes in.\n\nCan storage supply the whole evening?\n1.6 MWh delivered. Another 0.4 MWh must come from elsewhere.\nClassroom assumptions: 2.0 MWh charged, 80% round-trip efficiency, 2.0 MWh evening demand.", "image": "student-33.webp?v=21c220c1cd", "activity": "grid"}, {"title": "Wind design and siting can reduce harm", "body": "CHAPTER 10  /  SOLUTIONS\nWind design and siting can reduce harm\n34 / 48\nOlder lattice towers\nNewer tubular towers\nRepowering can reduce some bird risks. Careful siting and monitoring remain essential.\nFig. 10.42: turbine designs differ in perch availability and operating characteristics.", "image": "student-34.webp?v=8d87068d9e"}, {"title": "Experiment: changing turbine operation protects bats", "body": "CHAPTER 10  /  SOLUTIONS\nExperiment: changing turbine operation protects bats\n35 / 48\nReduction in bat fatalities (%)\nTested on 21 turbines\nReduce rotor motion during low-wind periods when bats are at risk.\nFewer fatalities—not zero risk. Site-specific evidence matters.\nBaerwald et al. (2009): reductions relative to normal operation at one Alberta site during the peak fatality period.", "image": "student-35.webp?v=b321c45146", "activity": "safeguards"}, {"title": "Safer transmission routes and visible lines", "body": "CHAPTER 10  /  SOLUTIONS\nSafer transmission routes and visible lines\n36 / 48\nAvoid important flight, feeding, and roosting areas\n\nUse suitable existing rights of way\n\nMark high-risk spans and measure the outcome\nFig. 10.44: markers make electrical lines more visible to birds.", "image": "student-36.webp?v=004475bfb4"}, {"title": "Run-of-the-river hydropower preserves some flow", "body": "CHAPTER 10  /  SOLUTIONS\nRun-of-the-river hydropower preserves some flow\n37 / 48\n1  Divert only part of the river\n2  Maintain ecological flow\n3  Provide fish passage and monitor impacts\nAdapted from Figs. 10.45–10.46: a diversion supplies a powerhouse while the main channel retains flow and fish passage.", "image": "student-37.webp?v=0b796b8521"}, {"title": "Existing dams can offer alternatives to new barriers", "body": "CHAPTER 10  /  SOLUTIONS\nExisting dams can offer alternatives to new barriers\n38 / 48\nAssess suitable existing unpowered dams\nImprove fish passage and operating rules\nCompare refurbishment with removal and other options\nFig. 10.46: a fish bypass at a low dam illustrates one approach to maintaining passage.", "image": "student-38.webp?v=e17cbd80b9"}, {"title": "Lower-impact biofuels start with the feedstock", "body": "CHAPTER 10  /  SOLUTIONS\nLower-impact biofuels start with the feedstock\n39 / 48\nUse appropriate residues and waste streams\nProtect forests, soils, and food production\nEvaluate algae and cellulosic pathways over their full life cycle\nFig. 10.50: algae cultivation is a potential biofuel pathway, with its own resource and processing requirements.", "image": "student-39.webp?v=d057a9e2d7"}, {"title": "Policy and community participation shape deployment", "body": "CHAPTER 10  /  SOLUTIONS\nPolicy and community participation shape deployment\n40 / 48\nClear permitting and grid-connection processes\nFinancing and incentives aligned with environmental goals\nEnforceable habitat and land-use protections\nMeaningful community participation and fair distribution of benefits\nTechnical design and social decisions jointly determine the outcome.", "image": "student-40.webp?v=dd0833219b"}, {"title": "Solutions summary", "body": "CHAPTER 10  /  SOLUTIONS\nSolutions summary\n41 / 48\n10.8\nSolar: improve siting, cooling design, and storage.\n\n10.9\nWind: reduce wildlife exposure through siting and operation.\n\n10.10\nHydropower: maintain river function and assess existing barriers.\n\n10.11\nBiofuels: protect ecosystems and choose suitable feedstocks.", "image": "student-41.webp?v=16f110ce9c"}, {"title": "Grid challenge: four hours after sunset", "body": "CHAPTER 10  /  APPLICATION\nGrid challenge: four hours after sunset\n42 / 48\nDEMAND\n10 MW\nWIND\n3 MW\nHYDRO\n4 MW\nSOLAR (Photovoltaic)\n0 MW\n\nBATTERY\n3 MW maximum  •  12 MWh usable\nCan the lights stay on for all four hours?\nGap = 3 MW × 4 hours = 12 MWh. Yes—exactly enough in this model.\nHypothetical isolated system. Battery starts full with 12 MWh usable output and a 3 MW discharge limit.", "image": "student-42.webp?v=bf5f4f3927", "activity": "grid"}, {"title": "Grid challenge: the wind drops", "body": "CHAPTER 10  /  APPLICATION\nGrid challenge: the wind drops\n43 / 48\nDEMAND\n10 MW\nWIND\n1 MW\nHYDRO\n4 MW\n0 MW\n\nBATTERY\n3 MW maximum  •  12 MWh usable\nIs the battery enough now? Propose a response.\nGap: 5 MW for 4 hours = 20 MWh. Reduce demand by 2 MW, or add 2 MW of reliable supply.\nSame four-hour scenario, but wind now supplies 1 MW throughout the period. No automatic grid imports are available.\nSOLAR (Photovoltaic)", "image": "student-43.webp?v=76b0c21602", "activity": "grid"}, {"title": "What students should take away", "body": "CHAPTER 10  /  TAKEAWAYS\nWhat students should take away\n44 / 48\nMechanism\nTrace energy from its primary source to useful output.\n\nConsequences\nInclude land, water, wildlife, and affected communities.\n\nDesign\nMatch the solution to the specific impact and location.\n\nReliability\nCheck both the rate of supply and how long it can last.", "image": "student-44.webp?v=e1b6657236"}, {"title": "Returning to the central question", "body": "CHAPTER 10  /  CENTRAL QUESTION\nReturning to the central question\n45 / 48\nCan we develop renewable energy resources to help sustain a thriving economy without adversely affecting the environment?\nRenewables can support a thriving economy while reducing many harms. Their environmental performance depends on where and how we build and operate the system.\nZero impact is not a realistic promise\nLower demand, careful siting, and verified safeguards improve the outcome", "image": "student-45.webp?v=1401766aa3"}, {"title": "Renewable energy and you", "body": "CHAPTER 10  /  TAKEAWAYS\nRenewable energy and you\n46 / 48\nReduce avoidable energy use\nChoose efficient buildings, appliances, and transport where feasible\nEvaluate energy proposals using evidence\nParticipate in local decisions and ask who benefits\nIndividual choices matter alongside action by institutions, industry, and government.", "image": "student-46.webp?v=b938a54465"}, {"title": "Exit questions", "body": "CHAPTER 10  /  DISCUSSION\nExit questions\n47 / 48\n01\nWhy can a renewable energy project still harm an ecosystem?\nInfrastructure, resource use, and operation can change habitats and communities.\n\n02\nWhich change could reduce bat fatalities at a wind farm?\nReduce rotor motion during high-risk low-wind periods, then monitor results.\n\n03\nWhy is a 3 MW battery rating insufficient to describe its usefulness?\nWe also need usable MWh capacity to know how long it can supply power.\nExplain a mechanism, a mitigation, and one limitation.", "image": "student-47.webp?v=09291eb66d"}, {"title": "Sources and further reading", "body": "CHAPTER 10  /  REFERENCES\nSources and further reading\n48 / 48\nPRIMARY COURSE SOURCE\nMolles & Borrell (2016)\nEnvironment: Science, Issues, Solutions\nChapter 10 · Renewable Energy\nMECHANISMS AND EMPIRICAL EVIDENCE\nU.S. Department of Energy · solar, wind, geothermal, and storage\nBaerwald et al. (2009) · turbine operation and bat fatalities\nThe Journal of Wildlife Management · doi:10.2193/2008-233\nPractice Chapters 9 and 10 in the Exam Center\nemohellebi.github.io/teaching/courses/environmental-science/exam-center/", "image": "student-48.webp?v=c959e25908"}]</script><script src="../../energy-assets/player.js"></script></body></html>

<script id="slide-data" type="application/json">[{"title": "Fossil Fuelsand NuclearEnergy", "body": "CHAPTER 9  /  OPENING\n01 / 64\nFossil Fuels\nand Nuclear\nEnergy\nFollow the energy.\nAccount for the consequences.\nThe hidden system behind the light switch\nMain Source:\nManuel Molles and Brendan Borrell. Environment: Science, Issues, Solutions. W. H. Freeman, 2016. Chapter 9, printed pp. 262–263", "image": "student-01.webp"}, {"title": "How can we reduce the harm?", "body": "CHAPTER 9  /  CENTRAL QUESTION\n02 / 64\nHow can we reduce the harm?\nHow can we manage nonrenewable energy resources in a way that reduces environmental harm?\nSCIENCE  →  ISSUES  →  SOLUTIONS  →  TAKEAWAYS", "image": "student-02.webp"}, {"title": "Electricity Generation – Using Combustible Materials", "body": "CHAPTER 9  /  SCIENCE\n03 / 64\nElectricity Generation – Using Combustible Materials\nChemical Energy                               Electrical Energy\n\nFig. 9.14, reconstructed. Burning fuel produces steam that turns a turbine and drives the electric generator.", "image": "student-03.webp"}, {"title": "Process of electricity generation from combustible fuels", "body": "CHAPTER 9  /  SCIENCE\n04 / 64\nProcess of electricity generation from combustible fuels\nCHEMICAL ENERGY\nTHERMAL ENERGY\nMECHANICAL\nELECTRICAL\n\nFuel + oxygen\n\nBoiler\n\nSteam\nturbine\n\nGenerator\n\n\n\nCombustion releases heat\nSteam expands\nand turns the shaft\nMagnetic induction\nproduces current\nFlue gas leaves the stack.\nAsh remains after combustion.\n\nCondenser\n\n\nCooling system\n\n\n\n\nLiquid water returns\nWaste heat → environment\nFig. 9.14, redrawn: burning fuel supplies the heat that produces steam, turns a turbine, and drives an electrical generator.", "image": "student-04.webp"}, {"title": "How an electrical generator works", "body": "CHAPTER 9  /  SCIENCE\n05 / 64\nHow an electrical generator works\nFig. 9.12, reconstructed. Rotation changes magnetic flux and induces voltage. A closed circuit allows current to flow.\nMechanical energy → electrical energy", "image": "student-05.webp"}, {"title": "Three fuels, ancient chemical energy", "body": "CHAPTER 9  /  SCIENCE\n06 / 64\nThree fuels, ancient chemical energy\nCoal: buried plant material\nOil: transformed organic matter\nNatural gas: predominantly methane", "image": "student-06.webp", "activity": "fuels"}, {"title": "Three fuels, ancient chemical energy", "body": "CHAPTER 9  /  SCIENCE\n07 / 64\nThree fuels, ancient chemical energy\nCoal: buried plant material\nOil: transformed organic matter\nNatural gas: predominantly methane", "image": "student-07.webp"}, {"title": "Coal formation: buried plant material", "body": "CHAPTER 9  /  SCIENCE\n08 / 64\nCoal formation: buried plant material\nSwamp vegetation\n\n\n\n\n\nPlant remains\nDead plant material collects\nin waterlogged sediments.\n\nBurial in sediment\n\n\n\n\n\nBuried organic layer\nSediment covers and compresses\nthe organic-rich layer.\n\nHeat + pressure\n\n\n\n\n\nCoal seam\nDeeper burial transforms the\nmaterial into coal.\nFig. 9.1, redrawn: plant remains buried in ancient swamp sediments become coal over millions of years. Layers are schematic.", "image": "student-08.webp"}, {"title": "Coal grades differ in carbon and energy content", "body": "CHAPTER 9  /  SCIENCE\n09 / 64\nCoal grades differ in carbon and energy content\nEnergy content (kJ/kg) · approximate heights read from the book\nCarbon content and hardness increase across these grades.\nFig. 9.2, redrawn approximately: energy content rises from lignite to bituminous coal, then decreases slightly for anthracite.", "image": "student-09.webp"}, {"title": "Coal reserves are geographically concentrated", "body": "CHAPTER 9  /  SCIENCE\n10 / 64\nCoal reserves are geographically concentrated\nShare of global reserves (%) · 2008 book data · approximate bar readings\nNine countries hold more than 90% in the book’s dataset.\nFig. 9.3, national panel redrawn: known coal reserves cluster in a small number of countries. Regional pie/map omitted; full reference remains in the book.", "image": "student-10.webp"}, {"title": "Regional coal reserves", "body": "CHAPTER 9  /  SCIENCE\n11 / 64\nRegional coal reserves\nRegional shares in the book’s 2008 dataset\nMost coal reserves lie in Northern Eurasia, Asia Pacific and North America.\nFig. 9.3, reconstructed. Approximate slice sizes read from the printed pie; not exact source percentages.", "image": "student-11.webp"}, {"title": "Three fuels, ancient chemical energy", "body": "CHAPTER 9  /  SCIENCE\n12 / 64\nThree fuels, ancient chemical energy\nNatural gas: predominantly methane\nCoal: buried plant material\nOil: transformed organic matter", "image": "student-12.webp"}, {"title": "Petroleum formation: buried marine organisms", "body": "CHAPTER 9  /  SCIENCE\n13 / 64\nPetroleum formation: buried marine organisms\nMarine organisms\n\n\n\n\n\nOrganic remains\nAlgae and zooplankton settle\nto the seafloor.\n\nBurial in sediment\n\n\n\n\n\nBuried organic layer\nOrganic-rich material becomes\nburied under layers of rock.\n\nHeat + pressure\n\n\n\n\n\nPetroleum\nKerogen transforms into oil\nover millions of years.\nFig. 9.4, redrawn: petroleum originates from buried marine organisms transformed over millions of years. Layers are schematic.", "image": "student-13.webp"}, {"title": "Oil refining separates useful fractions", "body": "CHAPTER 9  /  SCIENCE\n14 / 64\nOil refining separates useful fractions\nFig. 9.5, redrawn: a fractionating column separates crude oil into useful fractions by their different boiling ranges; lighter fractions rise higher.", "image": "student-14.webp"}, {"title": "Oil refining separates useful fractions", "body": "CHAPTER 9  /  SCIENCE\n15 / 64\nOil refining separates useful fractions\nCooler at the top\nHotter at the bottom\n\n\nGases\nLPG\n\n\nNaphtha\nChemical feedstocks\n\n\nGasoline\nVehicles\n\n\nKerosene\nJet fuel\n\n\nDiesel oil\nDiesel engines\n\n\nLubricants\nOils, greases, waxes\n\n\nHeavy oil\nFuel and heating oil\n\n\nResidue\nRoads and roofing\nHeated\ncrude oil\n\nFig. 9.5, redrawn: a fractionating column separates crude oil into useful fractions by their different boiling ranges; lighter fractions rise higher.", "image": "student-15.webp"}, {"title": "Oil reserves: a different geographic pattern", "body": "CHAPTER 9  /  SCIENCE\n16 / 64\nOil reserves: a different geographic pattern\nShare of global reserves (%) · 2011 book data · approximate bar readings\nThe book locates just over half of proven reserves in the Middle East.\nFig. 9.6, national panel redrawn: 15 countries hold more than 90% of known oil reserves in this historical dataset.", "image": "student-16.webp"}, {"title": "Regional oil reserves", "body": "CHAPTER 9  /  SCIENCE\n17 / 64\nRegional oil reserves\nRegional shares in the book’s 2011 dataset\nThe Middle East holds just over half of the reserves in this book figure.\nFig. 9.6, reconstructed. Approximate slice sizes read from the printed pie; not exact source percentages.", "image": "student-17.webp"}, {"title": "Three fuels, ancient chemical energy", "body": "CHAPTER 9  /  SCIENCE\n18 / 64\nThree fuels, ancient chemical energy\nNatural gas: predominantly methane\nCoal: buried plant material\nOil: transformed organic matter", "image": "student-18.webp"}, {"title": "Natural gas contains several hydrocarbons", "body": "CHAPTER 9  /  SCIENCE\n19 / 64\nNatural gas contains several hydrocarbons\nMethane\n\nC\nCH₄\nElectricity, heating,\nand cooking\nEthane\n\n\nC\n\nC\nCH₃–CH₃\nChemical\nfeedstocks\nPropane\n\n\nC\n\n\nC\n\nC\nCH₃–CH₂–CH₃\nHeating, cooking,\nand bottled fuel\nButane\n\n\nC\n\n\nC\n\n\nC\n\nC\nCH₃–CH₂–CH₂–CH₃\nFuel and industrial\nfeedstocks\nFig. 9.7, redrawn: natural gas contains hydrocarbons, usually dominated by methane. All C–H and C–C bonds are shown. Flat structural diagrams do not show 3D bond angles.\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH\n\n\nH", "image": "student-19.webp"}, {"title": "Natural gas reserves are also concentrated", "body": "CHAPTER 9  /  SCIENCE\n20 / 64\nNatural gas reserves are also concentrated\nShare of global reserves (%) · 2011 book data · approximate bar readings\nRussia, Iran, and Qatar hold more than half in the book’s dataset.\nFig. 9.10, national panel redrawn: a few countries control a large share of known gas reserves. Historical distribution, not a current ranking.", "image": "student-20.webp"}, {"title": "Regional natural gas reserves", "body": "CHAPTER 9  /  SCIENCE\n21 / 64\nRegional natural gas reserves\nRegional shares in the book’s 2011 dataset\nThe Middle East and Northern Eurasia dominate this historical distribution.\nFig. 9.10, reconstructed. Approximate slice sizes read from the printed pie; not exact source percentages.", "image": "student-21.webp"}, {"title": "Natural gas deposits, oil and coal beds", "body": "CHAPTER 9  /  SCIENCE\n22 / 64\nNatural gas deposits, oil and coal beds\nGas can migrate through porous rock and collect beneath an impermeable layer.\nFig. 9.8, reconstructed teaching schematic. Colored zones represent fluids in rock pores, not open caverns.", "image": "student-22.webp"}, {"title": "Electricity Generation – Using Nuclear Power", "body": "CHAPTER 9  /  SCIENCE\n23 / 64\nElectricity Generation – Using Nuclear Power\nNuclear Energy --------------------- Electrical Energy\nFig. 9.17, reconstructed. Fission supplies heat. Three separate water circuits transfer heat without mixing.", "image": "student-23.webp"}, {"title": "Electricity Generation – Using Nuclear Power", "body": "CHAPTER 9  /  SCIENCE\n24 / 64\nElectricity Generation – Using Nuclear Power\nNUCLEAR ENERGY\nTHERMAL ENERGY\nMECHANICAL\n\nReactor core\n\nSteam\ngenerator\n\nSteam\nturbine\n\nGenerator\n\n\n\nFission releases heat\nSteam expands\nand turns the shaft\nMagnetic induction\nproduces current\nPrimary coolant loop\ntransfers heat; water stays separate\n\nCondenser\n\n\nCooling system\n\n\n\n\nLiquid water returns\nFig. 9.17, redrawn: controlled fission supplies heat for steam-driven electricity generation. The cooling loop removes waste heat.", "image": "student-24.webp"}, {"title": "Nuclear Energy", "body": "CHAPTER 9  /  SCIENCE\n25 / 64\nNuclear Energy", "image": "student-25.webp"}, {"title": "Nuclear Energy", "body": "CHAPTER 9  /  SCIENCE\n26 / 64\nNuclear Energy\nFig. 9.15, reconstructed with full isotope names. Fission splits nuclei. Fusion combines nuclei.", "image": "student-26.webp"}, {"title": "Share of global recoverable uranium (%) · 2012 book data · approximate bar readings", "body": "CHAPTER 9  /  SCIENCE\n27 / 64\nShare of global recoverable uranium (%) · 2012 book data · approximate bar readings\nAustralia accounts for nearly one-third in this historical inventory.\nFig. 9.16, national panel redrawn: recoverable uranium reserves concentrate in relatively few countries. Bars show the 14 countries plotted in the book.\nUranium is a finite and unevenly distributed fuel", "image": "student-27.webp"}, {"title": "Regional uranium reserves", "body": "CHAPTER 9  /  SCIENCE\n28 / 64\nRegional uranium reserves\nRegional shares in the book’s 2012 dataset\nAsia Pacific has the largest regional share in the book’s distribution.\nFig. 9.16, reconstructed. Approximate slice sizes read from the printed pie; not exact source percentages.", "image": "student-28.webp"}, {"title": "Electricity mixes differ among regions", "body": "CHAPTER 9  /  SCIENCE\n29 / 64\nElectricity mixes differ among regions\nShare of electrical generation (%)\nFig. 9.13, redrawn. Fossil fuels dominate the world/U.S. examples, while renewables dominate Brazil.\nBook values retained. Rounded shares total 100%, 99%, and 98%, respectively. Brazil’s year is unspecified.\nSource\nWorld\n2011\nU.S.\n2013\nBrazil\nCoal\n41%\n39%\n1%\nNatural gas\n21%\n27%\n6%\nOil\n5%\n1%\n3%\nNuclear\n13%\n19%\n3%\nBiomass\n2%\n1%\n5%\nOther renewables\n18%\n12%\n80%", "image": "student-29.webp"}, {"title": "Electricity mixes differ among regions", "body": "CHAPTER 9  /  SCIENCE\n30 / 64\nElectricity mixes differ among regions\nShare of electrical generation (%)\nFig. 9.13. Printed shares total 100%, 99% and 98%. Pie areas scale to each total; labels retain book values.\nBrazil’s year is not specified in the book. These are historical electricity-generation shares.", "image": "student-30.webp"}, {"title": "Quick quiz: where does the energy go?", "body": "CHAPTER 9  /  SCIENCE\n31 / 64\nQuick quiz: where does the energy go?\nA steam power plant receives 100 units of fuel energy.\nAt 35% efficiency, how many units become electricity?\nA   35 units\nB   65 units\nC   100 units\nAnswer: 35 units of electricity; 65 units leave mainly as heat.\nClassroom calculation based on the book’s illustrative 35% conversion efficiency. Real plants and technologies differ.", "image": "student-31.webp", "activity": "thermal"}, {"title": "Science summary", "body": "CHAPTER 9  /  SCIENCE\n32 / 64\nScience summary\n9.1\nCoal, oil, and natural gas store chemical energy.\nTheir formation takes millions of years.\n\n9.2\nPower plants convert heat to motion and electricity.\nVehicle engines convert combustion energy to motion.\n\n9.3\nFission supplies intense heat for electricity generation.\nSafe use requires reaction control, cooling, and containment.", "image": "student-32.webp"}, {"title": "World consumption of energy resources", "body": "CHAPTER 9  /  ISSUES\n33 / 64\nWorld consumption of energy resources\nMillion metric tons of oil equivalent (Mtoe)\n1998–2014\nCoal and natural gas account for much of the growth shown.\nFig. 9.18, redrawn from the book’s graph. Annual values are approximate readings, not raw BP data.\nSource: Molles & Borrell, p. 275, citing BP (2009, 2011, 2013, 2015).", "image": "student-33.webp"}, {"title": "Oil production (billion barrels/year) · approximate redrawing of the book’s model curves", "body": "CHAPTER 9  /  ISSUES\n34 / 64\nOil production (billion barrels/year) · approximate redrawing of the book’s model curves\nThese are historical forecasts—not a prediction for today.\nFig. 9.21, model curves redrawn approximately: assumed total recoverable oil shifts the timing and height of the projected peak. After Maggio & Cacciola (2009).\nPeak oil forecasts depend on their assumptions", "image": "student-34.webp"}, {"title": "Electricity Generation – Using Nuclear Power", "body": "CHAPTER 9  /  SCIENCE\n35 / 64\nElectricity Generation – Using Nuclear Power\nNuclear Energy                                  Electrical Energy\n\nFig. 9.17, reconstructed. Fission supplies heat. Three separate water circuits transfer heat without mixing.", "image": "student-35.webp"}, {"title": "Electricity Generation – Using Combustible Materials", "body": "CHAPTER 9  /  SCIENCE\n36 / 64\nElectricity Generation – Using Combustible Materials\nChemical Energy                               Electrical Energy\n\nFig. 9.14, reconstructed. Burning fuel produces steam that turns a turbine and drives the electric generator.", "image": "student-36.webp"}, {"title": "Process of electricity generation from combustible fuels", "body": "CHAPTER 9  /  SCIENCE\n37 / 64\nProcess of electricity generation from combustible fuels\nCHEMICAL ENERGY\nTHERMAL ENERGY\nMECHANICAL\nELECTRICAL\n\nFuel + oxygen\n\nBoiler\n\nSteam\nturbine\n\nGenerator\n\n\n\nCombustion releases heat\nSteam expands\nand turns the shaft\nMagnetic induction\nproduces current\nFlue gas leaves the stack.\nAsh remains after combustion.\n\nCondenser\n\n\nCooling system\n\n\n\n\nLiquid water returns\nWaste heat → environment\nFig. 9.14, redrawn: burning fuel supplies the heat that produces steam, turns a turbine, and drives an electrical generator.", "image": "student-37.webp"}, {"title": "Main environmental issues", "body": "CHAPTER 9  /  ISSUES\n38 / 64\nMain environmental issues\nFinite resources and unequal access\nForest loss, habitat fragmentation, and buried streams\nAir pollutants, toxic metals, and climate-warming emissions\nWater depletion and contamination\nOil spills, coal sludge, and fly ash waste\nUranium-mine residues and long-lived spent fuel\nMajor accidents and lasting costs to communities\nExpanded issue list from §§9.4–9.6. Impacts occur during extraction, transport, use, and waste management.", "image": "student-38.webp"}, {"title": "Mountaintop removal changes entire watersheds", "body": "CHAPTER 9  /  ISSUES\n39 / 64\nMountaintop removal changes entire watersheds\nForests removed\nRock fills bury valleys\nand headwater streams.\nDust and polluted runoff\naffect ecosystems and\nnearby communities.\nMountaintop removal in West Virginia. Photo: Mary Hufford / Library of Congress, via USGS (public domain). Companion to the mechanisms discussed with Fig. 9.23.", "image": "student-39.webp"}, {"title": "Satellite images show the mining footprint expanding", "body": "CHAPTER 9  /  ISSUES\n40 / 64\nSatellite images show the mining footprint expanding\n1987\n2011\nSame region, Landsat 5: June 6, 1987 and June 8, 2011. Light disturbed areas expand among forested ridges. NASA / USGS.", "image": "student-40.webp"}, {"title": "Coal waste can contaminate land and water", "body": "CHAPTER 9  /  ISSUES\n41 / 64\nCoal waste can contaminate land and water\nCoal washing produces sludge.\nCombustion produces fly ash.\nPond failures spread slurry across land and rivers.\nMetals can also leach without a major spill.\nFig. 9.24: the Kingston, Tennessee, ash-pond failure released about 4 million m³ of slurry in December 2008. Book photo: David Luttrell / TVA.", "image": "student-41.webp"}, {"title": "Oil spills harm wildlife and human livelihoods", "body": "CHAPTER 9  /  ISSUES\n42 / 64\nOil spills harm wildlife and human livelihoods\nDeepwater Horizon, 2010\nThe rig explosion killed 11 workers.\nOil contaminated wildlife and coastal habitats.\nFishing and tourism communities lost income.\nEffects can persist after visible oil disappears.\nAn oiled brown pelican is captured for cleaning after Deepwater Horizon. Photo: Tom Mackenzie / USFWS (public domain).", "image": "student-42.webp"}, {"title": "Oil-sands mining removes a living landscape", "body": "CHAPTER 9  /  ISSUES\n43 / 64\nOil-sands mining removes a living landscape\nBoreal forest and wetlands\nSurface mine\nFig. 9.25: oil-sands extraction removes the overlying forest, wetlands, and ponds. Book photos: Ashley Cooper / Alamy and Brett Gundlock / Bloomberg via Getty Images.", "image": "student-43.webp"}, {"title": "Fracking risks extend through the water cycle", "body": "CHAPTER 9  /  ISSUES\n44 / 64\nFracking risks extend through the water cycle\n01\n\nAcquire water\nCompeting demand\n\n02\n\nMix chemicals\nSurface spills\n\n03\n\nInject into well\nWell integrity\n\n04\n\nCollect wastewater\nLeaks and spills\n\n05\n\nTreat / dispose\nDischarge; disposal\nA water-quality risk can arise at every stage—not only deep underground.\nFig. 9.26, redrawn: acquiring, mixing, injecting, recovering, and disposing of water can affect drinking-water resources. EPA’s final assessment (2016) supports this risk framework.", "image": "student-44.webp"}, {"title": "Nuclear impacts extend beyond the reactor", "body": "CHAPTER 9  /  ISSUES\n45 / 64\nNuclear impacts extend beyond the reactor\nMining\nTailings and contaminated sites can expose workers\nand communities to radioactive materials.\n\nSpent fuel\nHigh radioactivity and decay heat require shielding,\ncooling, secure storage, and long-term isolation.\n\nAccidents\nLoss of cooling or containment can damage fuel\nand release radioactive material.\nChapter synthesis, §9.6. A reactor’s lack of fossil-fuel combustion does not remove its mining, waste, cooling, or accident obligations.", "image": "student-45.webp"}, {"title": "Three nuclear accidents had different consequences", "body": "CHAPTER 9  /  ISSUES\n46 / 64\nThree nuclear accidents had different consequences\nAccident\nWhat failed\nEnvironmental significance\nThree Mile Island\n1979\nCoolant loss and misinterpreted\nplant conditions\nPartial meltdown; containment limited\nrelease. NRC found negligible health effects.\nChernobyl\n1986\nUnsafe test, reactor-design flaws,\nand explosion/fire\nLarge release without robust containment;\nwidespread fallout and long-term exclusion.\nFukushima Daiichi\n2011\nEarthquake and tsunami disabled\npower and cooling\nCore damage, hydrogen explosions, releases,\nevacuations, and prolonged cleanup.\nSynthesis accompanying Figs. 9.27–9.29: the initiating events, reactor designs, containment performance, and releases differed.", "image": "student-46.webp"}, {"title": "Compare complete pathways: extraction", "body": "CHAPTER 9  /  ISSUES\n47 / 64\nCompare complete pathways: extraction\nSystem\nExtraction & processing\nLand, water & community burdens\nCoal\nStrip mining; mountaintop removal;\ncoal washing\nForest and stream loss; acid mine drainage;\ndust; contaminated sludge\nOil\nDrilling; oil-sands mining;\nrefining and transport\nSpills; forest and peatland loss;\nwater use; contaminated habitats\nNatural gas\nDrilling; hydraulic fracturing;\ngathering and transport\nWater withdrawals; spills and well leakage;\nmethane loss; wastewater disposal\nNuclear\nUranium mining; milling;\nenrichment and fuel fabrication\nMine disturbance; radioactive tailings;\nworker and community exposure\nChapter synthesis, §§9.4–9.6: impacts start before a power plant operates. Wastewater injection can induce earthquakes; it is distinct from fracking.", "image": "student-47.webp"}, {"title": "Compare complete pathways: use and lasting waste", "body": "CHAPTER 9  /  ISSUES\n48 / 64\nCompare complete pathways: use and lasting waste\nSystem\nUse / operation\nWaste, accidents & continuing duties\nCoal\nCO₂; air pollutants and toxic metals;\ncooling demand and waste heat\nAsh and sludge containment; acid drainage;\nmine reclamation and water monitoring\nOil\nCO₂ and air pollutants from fuels;\nrefinery and transport impacts\nSpill cleanup; contaminated sediments;\nlong recovery of affected ecosystems\nNatural gas\nCO₂ and nitrogen oxides;\nmethane leakage across the system\nManage flowback and produced water;\nwell integrity; disposal-induced seismicity\nNuclear\nNo combustion in the reactor;\ncooling demand and waste heat\nSpent fuel and tailings; accident preparedness;\nsecure storage and decommissioning\nExpanded chapter synthesis, §§9.4–9.6. This inventory does not imply equal impact magnitudes or equal accident probabilities.", "image": "student-48.webp"}, {"title": "Issues summary", "body": "CHAPTER 9  /  ISSUES\n49 / 64\nIssues summary\n9.4\nFinite supplies and changing demand create pressure.\nForecasts depend on uncertain assumptions.\n\n9.5\nExtraction, combustion, spills, and residues damage\nland, water, air, and human well-being.\n\n9.6\nNuclear energy carries mining and waste burdens.\nMajor accidents reveal the importance of cooling and containment.", "image": "student-49.webp"}, {"title": "Preventing oil-industry harm", "body": "CHAPTER 9  /  SOLUTIONS\n50 / 64\nPreventing oil-industry harm\nEquipment\nDouble hulls, well integrity, maintenance,\nand reliable operating procedures reduce release risk.\n\nPlanning\nPrevention and response plans establish responsibilities\nbefore a spill and support rapid action afterward.\n\nLocation\nAvoiding development in sensitive areas prevents\nnew drilling-related disturbance at those sites.\nFrom §9.7: prevention combines engineering, oversight, preparedness, and decisions about where extraction should occur.", "image": "student-50.webp"}, {"title": "Oil-spill response has several distinct jobs", "body": "CHAPTER 9  /  SOLUTIONS\n51 / 64\nOil-spill response has several distinct jobs\nPREVENT\n\nKeep oil from escaping\nSafer equipment; maintenance;\nresponse plans; double hulls\nCONTAIN\n\nLimit the affected area\nBooms and barriers\nprotect sensitive coastlines\nRECOVER\n\nRemove accessible oil\nSkimmers collect oil;\ndispersants redistribute it\nMONITOR\n\nTest ecological recovery\nWater, sediments, wildlife,\nand ecosystem functions\nChapter synthesis, §9.7: spill response combines prevention, physical containment, removal, and long-term follow-up. Dispersal does not remove oil from the ecosystem.", "image": "student-51.webp", "activity": "spill"}, {"title": "Response-room challenge: which action fits?", "body": "CHAPTER 9  /  SOLUTIONS\n52 / 64\nResponse-room challenge: which action fits?\nA slick approaches a sensitive shoreline.\nBooms help protect the shoreline.\nResponders need to remove surface oil.\nSkimmers recover accessible oil.\nThe surface looks clean. Has the ecosystem recovered?\nTest water, sediment, organisms, and ecosystem function.\nDiscuss each scenario, then reveal the response. Conditions such as waves, currents, weather, and oil type affect which methods work.", "image": "student-52.webp", "activity": "spill"}, {"title": "Reducing the water risks of oil and gas extraction", "body": "CHAPTER 9  /  SOLUTIONS\n53 / 64\nReducing the water risks of oil and gas extraction\nRisk point\nMatching safeguard\nWater withdrawal\nAssess local supply and competing water needs.\nChemical mixing / storage\nDisclose hazardous ingredients and contain surface spills.\nWell injection\nVerify casing, cement, and separation from aquifers.\nFlowback and produced water\nUse secure storage, suitable treatment, and accountable disposal.\nDeep wastewater injection\nAssess local geology, monitor seismicity, and adjust operations.\nSafeguards follow the risk points in Fig. 9.26 and §9.7. They reduce risk; they do not establish zero risk at every site.", "image": "student-53.webp"}, {"title": "Prairie restoration rebuilds soil and vegetation", "body": "CHAPTER 9  /  SOLUTIONS\n54 / 64\nPrairie restoration rebuilds soil and vegetation\nMined landscape\nRestored grassland\nSave topsoil → reshape the land → replace soil → replant native vegetation\nFig. 9.31: restoring Wyoming mine land can create productive grazing and wildlife habitat. Book photos: Bruce Gordon / EcoFlight and Lee Bachstam.", "image": "student-54.webp"}, {"title": "Oil-sands restoration changes the ecosystem mix", "body": "CHAPTER 9  /  SOLUTIONS\n55 / 64\nOil-sands restoration changes the ecosystem mix\nChange in area after restoration (%) · values stated in the text\nMore tree cover can coexist with a large loss of peat wetlands.\nAdapted from Fig. 9.32 and the text: projected restoration increases forest/lake area but reduces peatlands. “All wetlands” includes peat wetlands; categories overlap.", "image": "student-55.webp"}, {"title": "Reclamation cannot replace a removed mountain", "body": "CHAPTER 9  /  SOLUTIONS\n56 / 64\nReclamation cannot replace a removed mountain\nA flatter, greener surface\ncan support grazing or\neconomic uses.\nOriginal relief, headwater\nstreams, soils, and forest\ndiversity may remain lost.\nFig. 9.33: reclaimed mountaintop mines commonly become level or gently sloping land with grasses and herbs. Photo: Kent Kessinger, flight courtesy of SouthWings.", "image": "student-56.webp"}, {"title": "Existing nuclear plants need resilient safety systems", "body": "CHAPTER 9  /  SOLUTIONS\n57 / 64\nExisting nuclear plants need resilient safety systems\nPlan for simultaneous failures and multiple hazards.\nProtect backup power and long-duration cooling.\nMonitor spent-fuel pools and maintain backup water supplies.\nImprove reliable venting where the reactor design requires it.\nReassess earthquake, flood, and communication vulnerabilities.\nFrom §9.9: post-Fukushima recommendations address the safety functions that must survive severe external events and extended power loss.", "image": "student-57.webp", "activity": "reactor"}, {"title": "Passive safety: gravity and natural circulation", "body": "CHAPTER 9  /  SOLUTIONS\n58 / 64\nPassive safety: gravity and natural circulation\nUse natural forces to maintain cooling\n\nElevated water supply\n\n\nReactor / containment cooling\nGravity\nStored water moves downward\n\nNatural circulation\nWarm fluid rises; cooler fluid returns.\nHeat transfer can continue without\nrelying entirely on powered pumps.\nPassive does not mean unlimited.\nDesign limits, supplies, maintenance, and\nlong-term heat removal still matter.\nAdapted from Fig. 9.34: simpler design and passive safety features reduce dependence on active equipment. This is a principle diagram, not AP1000 piping.", "image": "student-58.webp"}, {"title": "Further nuclear options carry tradeoffs", "body": "CHAPTER 9  /  SOLUTIONS\n59 / 64\nFurther nuclear options carry tradeoffs\nReprocessing spent fuel\nRecover uranium and plutonium\nfor reuse in mixed-oxide fuel.\n\nPotential benefit: more use of\nexisting nuclear material.\n\nContinuing burdens: waste handling,\nsecurity, and proliferation concerns.\nFusion research\nFuse light nuclei at extremely\nhigh temperatures.\n\nPotential benefit: a different\nfuel cycle.\n\nScientific and engineering barriers\nseparate experiments from power supply.\n\nFrom §9.9: recycling fuel and researching fusion do not remove the need to manage present-day waste and reactor safety.", "image": "student-59.webp"}, {"title": "Solutions summary", "body": "CHAPTER 9  /  SOLUTIONS\n60 / 64\nSolutions summary\n9.7\nPrevent releases, prepare for accidents, and improve\nresponse. Reduce unnecessary resource consumption.\n\n9.8\nRestore soil, vegetation, and ecosystem function\nwhere possible. Recognize irreversible losses.\n\n9.9\nStrengthen existing reactors’ safety functions.\nUse simpler designs and evaluate passive safeguards.", "image": "student-60.webp"}, {"title": "The whole chapter in three questions", "body": "CHAPTER 9  /  TAKEAWAYS\n61 / 64\nThe whole chapter in three questions\nSCIENCE\nWhere does the energy come from, and how\ndoes a power plant or engine transform it?\n\nISSUES\nWhich harms arise across extraction, use, and waste,\nand who experiences those harms?\n\nSOLUTIONS\nWhich safeguards reduce those harms, and which\nlosses or responsibilities remain afterward?", "image": "student-61.webp"}, {"title": "Fossil fuels, nuclear energy, and you", "body": "CHAPTER 9  /  TAKEAWAYS\n62 / 64\nFossil fuels, nuclear energy, and you\nStay informed about energy sources and their full costs.\nParticipate in local decisions and ask who bears the risks.\nUse energy efficiently in buildings and daily activities.\nChoose lower-energy transportation when safe and practical.\nAdapted from “Fossil Fuels, Nuclear Energy, and You.” Personal choices complement the engineering and policy changes discussed in the chapter.", "image": "student-62.webp"}, {"title": "Returning to the central question", "body": "CHAPTER 9  /  CENTRAL QUESTION\n63 / 64\nReturning to the central question\nA synthesis answer\nUse less energy for the services we need. Prevent pollution\nand accidents across the full fuel cycle. Restore damaged\necosystems where possible, and maintain long-term care\nfor waste and contamination. Evaluate the remaining harms\nwhile moving toward more sustainable energy sources.\nProposed answer derived from the chapter. Page 293 asks students to compose an answer; it does not provide a printed answer key.", "image": "student-63.webp"}, {"title": "What would change your energy decision?", "body": "CHAPTER 9  /  DISCUSSION\n64 / 64\nWhat would change your energy decision?\nWhich impact deserves more weight in your community?\nWhat measurement would help you compare the alternatives?\nWhich safeguard would you require, and how would you test it?", "image": "student-64.webp"}]</script><script src="../../energy-assets/player.js"></script></body></html>
